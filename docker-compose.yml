version: '3'

services:
  postgres_db:
    image: postgres
    restart: always
    env_file: ./.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  server:
    build: .
    ports:
      - 5000:5000
    restart: always
    env_file: ./.env
    depends_on:
      - postgres_db

volumes:
  postgres_data: ~
